description: >-
  Shahabedin (Shahab) Sagheb is an Assistant Collegiate Professor at Virginia Tech,
  appointed in the Honors College in the Calhoun Discovery Program (CDP) and the
  School of Architecture + Design. His research focuses on augmenting objects and
  humans in Virtual Reality, Augmented Reality, and Mixed Reality experiences, as
  well as human-robot collaboration and haptics.
